<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 — not significant · Mark Akritas</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<script>try { if (localStorage.getItem("theme") === "dark") document.documentElement.dataset.theme = "dark"; var a = localStorage.getItem("accent"); if (a) document.documentElement.dataset.accent = a; } catch (e) {}</script>
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  .nf { min-height: 100svh; display: grid; place-content: center; gap: 22px; padding: 40px var(--gutter); max-width: 760px; margin: auto; }
  .nf .code { font-size: clamp(72px, 16vw, 150px); font-weight: 700; line-height: .9; letter-spacing: -.05em; color: var(--fg); }
  .nf .code span { color: var(--accent); }
  .nf svg { width: 100%; height: auto; overflow: visible; }
  .nf .axis { stroke: var(--faint); stroke-width: 1; fill: none; }
  .nf .curve { stroke: var(--fg2); stroke-width: 1.4; fill: none; }
  .nf .tail { fill: url(#hatch404); }
  .nf .obs { stroke: var(--accent); stroke-width: 1.4; stroke-dasharray: 3 3; }
  .nf text { font-family: var(--mono); font-size: 11px; font-style: italic; fill: var(--muted); }
  .nf p { color: var(--fg2); max-width: 60ch; }
</style>
</head>
<body>
<div class="paper" aria-hidden="true"></div>
<main class="nf">
  <p class="kicker">error · page not found</p>
  <p class="code">4<span>0</span>4</p>
  <svg viewBox="0 0 600 170" role="img" aria-label="A normal curve with this page far out in the tail, well past the significance threshold">
    <defs><pattern id="hatch404" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)"><path d="M0 0V5" style="stroke:var(--accent);stroke-width:.9;opacity:.5"/></pattern></defs>
    <path class="tail" id="tail"/>
    <path class="axis" d="M10 140H590"/>
    <path class="curve" id="curve"/>
    <path class="obs" d="M542.4 140V40"/>
    <text x="546" y="34" text-anchor="end">this page, z = 4.04</text>
    <text x="300" y="160" text-anchor="middle">μ · where the pages usually are</text>
  </svg>
  <p>p &lt; 0.0001. Whatever you were looking for isn't on this site, at least not at this address. The resume is one page, and it starts <a href="/">here</a>; the first edition lives at <a href="/v1/">/v1</a>.</p>
</main>
<script>
  // draw the null distribution and shade the tail past the observation
  const f = (x) => 140 - 110 * Math.exp(-0.5 * ((x - 300) / 60) ** 2);
  const pts = []; for (let x = 10; x <= 590; x += 4) pts.push([x, f(x)]);
  document.getElementById("curve").setAttribute("d", "M" + pts.map((p) => p.join(" ")).join("L"));
  const tail = pts.filter(([x]) => x >= 542.4);
  document.getElementById("tail").setAttribute("d", `M542.4 140L${tail.map((p) => p.join(" ")).join("L")}L590 140Z`);
</script>
</body>
</html>
